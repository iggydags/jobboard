<style>
  :root{
    --paper:#F6F4EF; --surface:#FFFFFF; --surface-2:#FBFAF7;
    --ink:#1E2A33; --ink-soft:#5B6570; --ink-faint:#8A9099;
    --border:#E1DDD2; --border-strong:#CBC5B6;
    --accent:#0F5C56; --accent-light:#E1EFEC; --accent-ramp-1:#CFE3DF; --accent-ramp-2:#9AC3BC; --accent-ramp-3:#4E8F87;
    --red:#B23A2E; --red-light:#F8E5E2;
    --amber:#B4700F; --amber-light:#FBEDD9;
    --green:#3F7A4E; --green-light:#E4F0E6;
    --gray:#6B6F76; --gray-light:#EDEBE5;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono",Consolas,Menlo,monospace;
    --radius:8px; --shadow:0 1px 2px rgba(30,42,51,.06),0 1px 1px rgba(30,42,51,.04);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--font-ui);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
  button{font-family:inherit;}
  [hidden]{display:none!important;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .wrap{max-width:1440px;margin:0 auto;padding:22px 24px 80px;}

  /* ---------- header ---------- */
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
  .head h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.01em;}
  .head .sub{margin:3px 0 0;color:var(--ink-soft);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--border-strong);display:inline-block;}
  .live.on i{background:var(--green);box-shadow:0 0 0 3px var(--green-light);}
  .live.off i{background:var(--red);}
  .head-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .who{font-size:12px;color:var(--ink-soft);}

  .btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.2;}
  .btn:hover{background:var(--gray-light);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:var(--accent);border-color:var(--accent);}
  .btn-danger{color:var(--red);border-color:var(--red);}
  .btn-danger:hover{background:var(--red-light);}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--gray-light);color:var(--ink);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .tab:hover{color:var(--ink);}
  .tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);}
  .tab .n{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:var(--gray-light);color:var(--ink-soft);font-size:11.5px;font-weight:700;}
  .tab .n.alert{background:var(--red-light);color:var(--red);}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input[type=text],.toolbar select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;font-size:13.5px;background:var(--surface);color:var(--ink);font-family:inherit;}
  .toolbar input[type=text]{flex:1;min-width:200px;}
  .toolbar .spacer{margin-left:auto;}
  .toolbar .count{color:var(--ink-soft);font-size:12.5px;white-space:nowrap;}
  .chip-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-soft);user-select:none;}
  .chip-toggle input{margin:0;width:14px;height:14px;accent-color:var(--red);}
  .chip-toggle.on{background:var(--red-light);color:var(--red);border-color:var(--red);}

  /* ---------- table ---------- */
  .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;min-width:1240px;font-size:13.5px;}
  thead th{position:sticky;top:0;z-index:1;text-align:left;padding:10px 10px;background:var(--gray-light);color:var(--ink-soft);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th .dir{font-size:10px;margin-left:3px;opacity:.7;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.is-completed{color:var(--ink-faint);}
  tbody tr.is-completed .client{color:var(--ink-soft);}
  tbody tr.flash{animation:flash 1.4s ease-out;}
  @keyframes flash{0%{background:var(--accent-light);}100%{background:transparent;}}
  .job-no{font-family:var(--font-mono);font-weight:600;font-size:12.5px;}
  .client{font-weight:600;}
  .project-name{color:var(--ink-soft);}
  .muted{color:var(--ink-faint);}
  .notes-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap;line-height:1.3;}
  .badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}
  .pri-Low{background:var(--gray-light);color:var(--gray);}
  .pri-Medium{background:var(--accent-light);color:var(--accent);}
  .pri-High{background:var(--amber-light);color:var(--amber);}
  .pri-Rush{background:var(--red-light);color:var(--red);}
  .status-not{background:var(--gray-light);color:var(--gray);}
  .status-progress{background:var(--accent-light);color:var(--accent);}
  .status-hold{background:var(--amber-light);color:var(--amber);}
  .status-complete{background:var(--green-light);color:var(--green);}

  .due-date{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .due-overdue{color:var(--red);font-weight:700;}
  .due-soon{color:var(--amber);font-weight:600;}
  .due-meta{display:block;font-size:11px;font-weight:600;}
  .stall{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-light);padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap;}

  .stages{display:flex;gap:4px;}
  .stage-dot{width:26px;height:24px;border-radius:5px;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink-faint);background:var(--surface);cursor:pointer;user-select:none;flex-shrink:0;padding:0;font-family:var(--font-mono);}
  .stage-dot.done{background:var(--green);border-color:var(--green);color:#fff;}
  .stage-dot:hover{border-color:var(--ink);}
  .stage-dot.pending{opacity:.5;}

  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .icon-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;padding:0;}
  .icon-btn:hover{background:var(--gray-light);color:var(--ink);}
  .icon-btn.danger:hover{background:var(--red-light);color:var(--red);border-color:var(--red);}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty h3{color:var(--ink);margin:0 0 6px;font-size:17px;}
  .empty p{margin:0 0 18px;font-size:14px;}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);}

  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit;color:inherit;}
  .kpi:hover{border-color:var(--border-strong);}
  .kpi .label{font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
  .kpi .value{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .kpi.hero .value{font-size:48px;}
  .kpi.hero{grid-column:span 2;}
  .kpi.alert .value{color:var(--red);}
  .kpi.warn .value{color:var(--amber);}
  .kpi .delta{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .kpi .delta.bad{color:var(--red);}
  .kpi .delta.good{color:var(--green);}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0;}
  .card h2{margin:0 0 2px;font-size:14.5px;font-weight:650;}
  .card .hint{margin:0 0 14px;font-size:12px;color:var(--ink-soft);}
  .span-4{grid-column:span 4;} .span-6{grid-column:span 6;} .span-8{grid-column:span 8;} .span-12{grid-column:span 12;}
  @media (max-width:1100px){.span-4,.span-6,.span-8{grid-column:span 12;} .kpi.hero{grid-column:span 2;}}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr);} .kpi.hero{grid-column:span 2;}}

  /* horizontal bars */
  .hbars{display:grid;grid-template-columns:minmax(80px,max-content) 1fr auto;gap:8px 12px;align-items:center;font-size:13px;}
  .hbars .lab{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
  .hbars .track{height:16px;background:transparent;position:relative;}
  .hbars .bar{height:16px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px;transition:width .35s cubic-bezier(.16,1,.3,1);}
  .hbars .bar.soft{background:var(--accent-ramp-2);}
  .hbars .val{color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px;}
  .hbars .val b{color:var(--red);font-weight:700;}

  /* stacked status bar */
  .stack{display:flex;height:18px;gap:2px;border-radius:4px;overflow:hidden;background:var(--gray-light);margin-bottom:10px;}
  .stack div{height:100%;min-width:0;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* columns (throughput) */
  .cols{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border);padding:0 2px;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;}
  .col .c{width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .35s cubic-bezier(.16,1,.3,1);}
  .col .c.cur{background:var(--accent-ramp-3);}
  .col .v{position:absolute;top:-16px;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .col-labels{display:flex;gap:2px;padding:6px 2px 0;font-size:11px;color:var(--ink-faint);}
  .col-labels span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* attention list */
  .attn{width:100%;border-collapse:collapse;font-size:13px;min-width:0;}
  .attn th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);}
  .attn td{padding:8px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .attn tr:last-child td{border-bottom:none;}
  .attn tr{cursor:pointer;}
  .attn tr:hover{background:var(--surface-2);}
  .reason{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:4px;white-space:nowrap;}
  .reason.overdue{background:var(--red-light);color:var(--red);}
  .reason.stalled{background:var(--amber-light);color:var(--amber);}
  .reason.hold{background:var(--gray-light);color:var(--gray);}
  .reason.rush{background:var(--red-light);color:var(--red);}
  .reason.soon{background:var(--amber-light);color:var(--amber);}
  .ok{color:var(--green);font-weight:600;padding:14px 0;}

  /* funnel */
  .funnel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .fstep{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 8px;text-align:center;min-width:0;}
  .fstep .fn{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1;}
  .fstep .fl{font-size:11px;color:var(--ink-soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fstep.hot{border-color:var(--amber);background:var(--amber-light);}
  @media (max-width:800px){.funnel{grid-template-columns:repeat(4,1fr);}}

  /* activity */
  .feed{list-style:none;margin:0;padding:0;}
  .feed li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .feed li:last-child{border-bottom:none;}
  .feed time{color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums;}
  .feed .who{font-weight:600;color:var(--ink);}
  .feed .chg{color:var(--ink-soft);}
  .feed .chg code{font-family:var(--font-mono);font-size:12px;background:var(--gray-light);padding:1px 5px;border-radius:3px;color:var(--ink);}
  @media (max-width:640px){.feed li{grid-template-columns:1fr;gap:2px;}}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,42,51,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:10px;width:100%;max-width:680px;padding:24px 28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 2px;font-size:19px;display:flex;align-items:center;gap:10px;}
  .modal .sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:6px;font-size:14px;font-family:var(--font-ui);color:var(--ink);background:var(--surface);}
  .field input[readonly]{background:var(--gray-light);color:var(--ink-soft);}
  .field textarea{resize:vertical;min-height:56px;}
  .field .error{color:var(--red);font-size:12px;margin-top:4px;display:none;}
  .field.invalid input,.field.invalid select{border-color:var(--red);}
  .field.invalid .error{display:block;}
  .stage-check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
  .stage-check{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px;}
  .stage-check input{width:16px;height:16px;margin:0;accent-color:var(--green);}
  .stage-check.checked{background:var(--green-light);border-color:var(--green);}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;gap:10px;flex-wrap:wrap;}
  .modal-actions .left{display:flex;gap:10px;}
  .history{margin-top:18px;border-top:1px solid var(--border);padding-top:12px;}
  .history h3{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .history .feed li{padding:6px 0;font-size:12.5px;grid-template-columns:130px 1fr;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;} .stage-check-grid{grid-template-columns:repeat(2,1fr);} .modal{padding:20px 18px;}}

  /* ---------- auth ---------- */
  .auth{max-width:380px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px;box-shadow:var(--shadow);}
  .auth h1{margin:0 0 4px;font-size:20px;}
  .auth p{margin:0 0 18px;color:var(--ink-soft);font-size:13px;}
  .auth .field{margin-bottom:12px;}
  .auth .btn-primary{width:100%;margin-top:6px;}
  .auth .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:1em;}
  .setup{max-width:560px;margin:80px auto;background:var(--surface);border:1px solid var(--amber);border-radius:10px;padding:28px;}
  .setup code{font-family:var(--font-mono);font-size:12.5px;background:var(--gray-light);padding:1px 5px;border-radius:3px;}
  .setup ol{padding-left:20px;} .setup li{margin-bottom:8px;}

  .banner{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:200;max-width:90vw;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--red);}
  kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-soft);background:var(--surface);}
  .shortcuts{color:var(--ink-faint);font-size:12px;margin-top:10px;}
  @media print{.toolbar,.head-right,.tabs,.row-actions,.shortcuts{display:none!important;} .table-scroll{border:none;box-shadow:none;} body{background:#fff;}}
</style>
</head>
<body>

<div id="app"><div class="loading">Loading…</div></div>

<!-- ---------- edit modal ---------- -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">New job</h2>
    <p class="sub" id="modalSub">Fields marked with an asterisk are required.</p>
    <div class="form-grid">
      <div class="field" id="f-jobNo">
        <label for="in-jobNo">Job #</label>
        <input type="text" id="in-jobNo" readonly placeholder="Assigned on save">
      </div>
      <div class="field" id="f-client">
        <label for="in-client">Client *</label>
        <input type="text" id="in-client" placeholder="Client name" autocomplete="off" list="dl-clients">
        <div class="error">Enter a client name.</div>
      </div>
      <div class="field full" id="f-project">
        <label for="in-project">Job / project *</label>
        <input type="text" id="in-project" placeholder="What are we producing" autocomplete="off">
        <div class="error">Enter a project name.</div>
      </div>
      <div class="field" id="f-quantity">
        <label for="in-quantity">Quantity</label>
        <input type="text" id="in-quantity" placeholder="e.g. 500">
      </div>
      <div class="field" id="f-dueDate">
        <label for="in-dueDate">Due date</label>
        <input type="date" id="in-dueDate">
      </div>
      <div class="field" id="f-designer">
        <label for="in-designer">Designer</label>
        <input type="text" id="in-designer" placeholder="Who owns it" autocomplete="off" list="dl-designers">
      </div>
      <div class="field" id="f-priority">
        <label for="in-priority">Priority</label>

      <div class="left">
        <button class="btn" id="cancelBtn" type="button">Cancel</button>
        <button class="btn btn-danger" id="deleteBtn" type="button" hidden>Delete job</button>
      </div>

</div>

<datalist id="dl-designers"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =================================================================
   Job Board client
   - Supabase Auth (email + password) gates the app; RLS gates the data
   - Local state is the source of truth for rendering; every write is
     optimistic with rollback, and Realtime keeps every open tab in sync
   ================================================================= */
(function(){
'use strict';

const CFG = window.JOBBOARD_CONFIG || {};
const STAGE_KEYS = ["proof_sent","client_approved","production","printing","finishing","ready"];
const STAGE_SHORT = {proof_sent:"PR",client_approved:"AP",production:"PD",printing:"PT",finishing:"FN",ready:"RD"};
const STAGE_FULL  = {proof_sent:"Proof sent",client_approved:"Client approved",production:"Production",printing:"Printing",finishing:"Finishing",ready:"Ready"};
const FUNNEL_LABELS = ["Not started","Proofing","Approved","Production","Printing","Finishing","Ready"];
const STATUSES = ["Not Started","In Progress","On Hold","Completed"];
const STATUS_COLOR = {"Not Started":"#6B6F76","In Progress":"#0F5C56","On Hold":"#B4700F","Completed":"#3F7A4E"};
const PRIORITY_RANK = {Rush:0,High:1,Medium:2,Low:3};
const STALLED_DAYS = Number(CFG.stalledAfterDays) || 5;
const SOON_DAYS = Number(CFG.dueSoonDays) || 7;

/* ---------- state ---------- */
let sb = null;            // supabase client
let session = null;
let jobs = [];            // array of job rows
let byId = new Map();
let view = 'dashboard';   // dashboard | board | activity
let editingId = null;
let filters = {q:'', status:'', priority:'', designer:'', overdue:false};
let sort = {key:'due_date', dir:'asc'};
let realtimeState = 'off';
let pendingIds = new Set();
let loaded = false;
let loadError = null;
let activity = [];        // recent job_events
let activityLoaded = false;

/* ---------- utils ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const app = $('#app');
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }
function todayISO(){ const d=new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); }
function parseDate(d){ return d ? new Date(d+'T00:00:00') : null; }
function daysUntil(d){ if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((parseDate(d)-t)/86400000); }
function daysSince(ts){ if(!ts) return 0; return Math.floor((Date.now()-new Date(ts).getTime())/86400000); }
function fmtDate(d){ if(!d) return '–'; return parseDate(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDateFull(d){ if(!d) return '–'; return parseDate(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtTs(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function relTime(ts){ const s=(Date.now()-new Date(ts).getTime())/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
function toast(msg, isErr){ const t=$('#toast'); t.textContent=msg; t.classList.toggle('error',!!isErr); t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), isErr?3500:1800); }
function statusClass(s){ return {"Not Started":"status-not","In Progress":"status-progress","On Hold":"status-hold","Completed":"status-complete"}[s]||'status-not'; }
function pretty(v){ if(v===true) return 'yes'; if(v===false) return 'no'; if(v==null||v==='') return 'empty'; return String(v); }

/* ---------- derived job facts (one place, used by board + dashboard) ---------- */
function isOpen(j){ return j.status !== 'Completed'; }
function isOverdue(j){ return isOpen(j) && j.due_date && daysUntil(j.due_date) < 0; }
function isDueSoon(j){ if(!isOpen(j)||!j.due_date) return false; const d=daysUntil(j.due_date); return d>=0 && d<=SOON_DAYS; }
function isStalled(j){ return isOpen(j) && j.status !== 'On Hold' && daysSince(j.stage_changed_at) >= STALLED_DAYS; }
function stageIndex(j){ let i=0; for(let k=0;k<STAGE_KEYS.length;k++){ if(j[STAGE_KEYS[k]]) i=k+1; } return i; } // 0..6
function stageName(j){ return FUNNEL_LABELS[stageIndex(j)]; }

/* ---------- boot ---------- */
async function boot(){
  if(!CFG.supabaseUrl || /YOUR-PROJECT/.test(CFG.supabaseUrl) || !CFG.supabaseAnonKey || /YOUR-ANON-KEY/.test(CFG.supabaseAnonKey) || !window.supabase){
    renderSetup(); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true}});
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_evt, s)=>{
    const was = !!session; session = s;
    if(!!s !== was){ if(s) start(); else { stopRealtime(); render(); } }
  });
  if(session) start(); else render();
}

async function start(){
  loaded=false; loadError=null; render();
  await fetchJobs();
  startRealtime();
  render();
}

async function fetchJobs(){
  const { data, error } = await sb.from('jobs').select('*').order('created_at',{ascending:false}).limit(5000);
  if(error){ loadError = error.message; loaded=true; return; }
  setJobs(data||[]);
  loaded = true; loadError=null;
}
function setJobs(rows){ jobs = rows; byId = new Map(rows.map(j=>[j.id,j])); }
function upsertLocal(row){ const i=jobs.findIndex(j=>j.id===row.id); if(i>=0) jobs[i]=row; else jobs.unshift(row); byId.set(row.id,row); }
function removeLocal(id){ jobs = jobs.filter(j=>j.id!==id); byId.delete(id); }

/* ---------- realtime ---------- */
let channel = null;
function startRealtime(){
  stopRealtime();
  channel = sb.channel('jobs-feed')
    .on('postgres_changes', {event:'*', schema:'public', table:'jobs'}, payload=>{
      if(payload.eventType==='DELETE'){ removeLocal(payload.old.id); }
      else { upsertLocal(payload.new); flashRow(payload.new.id); }
      activityLoaded = false;
      render();
    })
    .subscribe(status=>{
      realtimeState = status==='SUBSCRIBED' ? 'on' : (status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED') ? 'off' : 'connecting';
      const el=$('#live'); if(el){ el.className='live '+(realtimeState==='on'?'on':realtimeState==='off'?'off':''); el.querySelector('span').textContent = realtimeState==='on'?'Live':realtimeState==='off'?'Offline, refresh to sync':'Connecting…'; }
    });
}
function stopRealtime(){ if(channel && sb){ sb.removeChannel(channel); channel=null; } }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && session){ fetchJobs().then(render); } });
window.addEventListener('online', ()=>{ if(session) fetchJobs().then(render); });

let flashQueue = new Set();
function flashRow(id){ flashQueue.add(id); }

/* ---------- writes (optimistic + rollback) ---------- */
async function persistUpdate(id, patch, label){
  const prev = byId.get(id); if(!prev) return;
  const next = {...prev, ...patch};
  upsertLocal(next); pendingIds.add(id); render();
  const { data, error } = await sb.from('jobs').update(patch).eq('id', id).select().single();
  pendingIds.delete(id);
  if(error){ upsertLocal(prev); render(); toast((label||'Update')+' failed: '+error.message, true); return false; }
  upsertLocal(data); render(); return true;
}
async function persistInsert(row){
  const tempId = 'tmp-'+Date.now();
  const optimistic = {...row, id:tempId, job_no:'…', created_at:new Date().toISOString(), updated_at:new Date().toISOString(), stage_changed_at:new Date().toISOString()};
  upsertLocal(optimistic); pendingIds.add(tempId); render();
  const { data, error } = await sb.from('jobs').insert(row).select().single();
  pendingIds.delete(tempId); removeLocal(tempId);
  if(error){ render(); toast('Could not add job: '+error.message, true); return null; }
  upsertLocal(data); flashRow(data.id); render(); return data;
}
async function persistDelete(id){
  const prev = byId.get(id); if(!prev) return false;
  removeLocal(id); render();
  const { error } = await sb.from('jobs').delete().eq('id', id);
  if(error){ upsertLocal(prev); render(); toast('Delete failed: '+error.message, true); return false; }
  return true;
}

/* ---------- top-level render ---------- */
function render(){
  if(!session){ renderAuth(); return; }
  if(!loaded){ app.innerHTML = '<div class="loading">Loading jobs…</div>'; return; }
  const open = jobs.filter(isOpen), overdue = jobs.filter(isOverdue);
  const scrollY = window.scrollY;
  app.innerHTML =
    `<div class="wrap">
      <div class="head">
        <div class="head-left">
          <h1>${esc(CFG.shopName||'Job Board')}</h1>
          <p class="sub"><span id="live" class="live ${realtimeState==='on'?'on':realtimeState==='off'?'off':''}"><i></i><span>${realtimeState==='on'?'Live':realtimeState==='off'?'Offline, refresh to sync':'Connecting…'}</span></span><span>·</span><span class="who">${esc(session.user.email)}</span></p>
        </div>
        <div class="head-right">
          <button class="btn btn-ghost btn-sm" id="exportBtn" type="button" title="Download every job as CSV">Export CSV</button>
          <button class="btn btn-ghost btn-sm" id="signOutBtn" type="button">Sign out</button>
          <button class="btn btn-primary" id="addJobBtn" type="button">+ New job</button>
        </div>
      </div>
      ${loadError?`<div class="banner">Could not load jobs: ${esc(loadError)}. Showing what is cached.</div>`:''}
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="dashboard" aria-selected="${view==='dashboard'}">Overview${overdue.length?`<span class="n alert">${overdue.length} overdue</span>`:''}</button>
        <button class="tab" role="tab" data-view="board" aria-selected="${view==='board'}">Board<span class="n">${open.length}</span></button>
        <button class="tab" role="tab" data-view="activity" aria-selected="${view==='activity'}">Activity</button>
      </div>
      <div id="viewRoot"></div>
    </div>`;
  $('#addJobBtn').addEventListener('click', ()=>openModal(null));
  $('#signOutBtn').addEventListener('click', ()=>sb.auth.signOut());
  $('#exportBtn').addEventListener('click', exportCSV);
  app.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ view=t.dataset.view; render(); }));
  const root = $('#viewRoot');
  if(view==='dashboard') renderDashboard(root);
  else if(view==='board') renderBoard(root);
  else renderActivity(root);
  window.scrollTo(0, scrollY);
  refreshDatalists();
}

/* ---------- auth + setup screens ---------- */
function renderAuth(){
  app.innerHTML =
    `<form class="auth" id="authForm">
      <h1>${esc(CFG.shopName||'Job Board')}</h1>
      <p>Sign in with your team account.</p>
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="authPass">Password</label><input id="authPass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" id="authBtn" type="submit">Sign in</button>
      <div class="err" id="authErr"></div>
    </form>`;
  $('#authForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=$('#authBtn'); btn.disabled=true; btn.textContent='Signing in…'; $('#authErr').textContent='';
    const { error } = await sb.auth.signInWithPassword({email:$('#authEmail').value.trim(), password:$('#authPass').value});
    if(error){ $('#authErr').textContent = error.message; btn.disabled=false; btn.textContent='Sign in'; }
  });
  $('#authEmail').focus();
}
function renderSetup(){
  app.innerHTML =
    `<div class="setup">
      <h2 style="margin:0 0 6px">Not configured yet</h2>
      <p>This page needs a Supabase project before it can store anything.</p>
      <ol>
        <li>Create a project at supabase.com and run <code>supabase/schema.sql</code> in the SQL editor.</li>
        <li>In Authentication, disable public sign-ups and add your team members as users.</li>
        <li>Open <code>index.html</code>, fill in <code>supabaseUrl</code> and <code>supabaseAnonKey</code> at the top, and redeploy.</li>
      </ol>
    </div>`;
}

/* ---------- board ---------- */
function visibleJobs(){
  const q = filters.q.toLowerCase();
  let v = jobs.filter(j=>{
    if(filters.status && j.status!==filters.status) return false;
    if(filters.priority && j.priority!==filters.priority) return false;
    if(filters.designer && (j.designer||'')!==filters.designer) return false;
    if(filters.overdue && !isOverdue(j)) return false;
    if(q){ const hay=[j.job_no,j.client,j.project,j.designer,j.notes].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const dir = sort.dir==='asc'?1:-1;
  const cmp = {
    job_no:(a,b)=>(Number(a.job_no)||0)-(Number(b.job_no)||0),
    client:(a,b)=>a.client.localeCompare(b.client),
    due_date:(a,b)=>{ if(!a.due_date&&!b.due_date) return 0; if(!a.due_date) return 1*dir; if(!b.due_date) return -1*dir; return a.due_date.localeCompare(b.due_date); },
    designer:(a,b)=>(a.designer||'~').localeCompare(b.designer||'~'),
    priority:(a,b)=>PRIORITY_RANK[a.priority]-PRIORITY_RANK[b.priority],
    status:(a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status),
    stage:(a,b)=>stageIndex(a)-stageIndex(b),
    updated_at:(a,b)=>a.updated_at.localeCompare(b.updated_at),
  }[sort.key] || (()=>0);
  v.sort((a,b)=>{
    // completed always sink unless explicitly sorting by status
    if(sort.key!=='status'){ const ac=a.status==='Completed', bc=b.status==='Completed'; if(ac!==bc) return ac?1:-1; }
    const r = cmp(a,b); if(r!==0) return r*dir;
    return (Number(a.job_no)||0)-(Number(b.job_no)||0);
  });
  return v;
}

function renderBoard(root){
  const designers = [...new Set(jobs.map(j=>j.designer).filter(Boolean))].sort();
  const visible = visibleJobs();
  const th = (key,label,cls='')=>`<th class="sortable ${cls}" data-sort="${key}" scope="col">${label}${sort.key===key?`<span class="dir">${sort.dir==='asc'?'▲':'▼'}</span>`:''}</th>`;
  root.innerHTML =
    `<div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search client, project, job #, notes  ( / )" value="${attr(filters.q)}" aria-label="Search jobs">
      <select id="filterStatus" aria-label="Filter by status"><option value="">All statuses</option>${STATUSES.map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="filterPriority" aria-label="Filter by priority"><option value="">All priorities</option>${['Low','Medium','High','Rush'].map(s=>`<option ${filters.priority===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="filterDesigner" aria-label="Filter by designer"><option value="">All designers</option>${designers.map(s=>`<option value="${attr(s)}" ${filters.designer===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <label class="chip-toggle ${filters.overdue?'on':''}"><input type="checkbox" id="filterOverdue" ${filters.overdue?'checked':''}> Overdue only</label>
      <span class="spacer"></span>
      <span class="count">${visible.length} of ${jobs.length} shown</span>
      ${(filters.q||filters.status||filters.priority||filters.designer||filters.overdue)?'<button class="btn btn-ghost btn-sm" id="clearFilters" type="button">Clear</button>':''}
    </div>
    <div id="tableHolder"></div>
    <p class="shortcuts"><kbd>n</kbd> new job &nbsp; <kbd>/</kbd> search &nbsp; <kbd>esc</kbd> close &nbsp; click a stage box to toggle it</p>`;

  const holder = $('#tableHolder');
  if(jobs.length===0){
    holder.innerHTML = '<div class="empty"><h3>No jobs yet</h3><p>Add the first job to start tracking it through the shop.</p><button class="btn btn-primary" id="emptyAdd" type="button">+ New job</button></div>';
    $('#emptyAdd').addEventListener('click', ()=>openModal(null));
  } else if(visible.length===0){
    holder.innerHTML = '<div class="empty"><h3>No jobs match</h3><p>Try clearing the search or filters.</p></div>';
  } else {
    const rows = visible.map(j=>{
      const pending = pendingIds.has(j.id);
      const stages = STAGE_KEYS.map(k=>`<button type="button" class="stage-dot ${j[k]?'done':''} ${pending?'pending':''}" title="${STAGE_FULL[k]}: ${j[k]?'done':'not yet'}" aria-pressed="${!!j[k]}" aria-label="${STAGE_FULL[k]}" data-job="${j.id}" data-stage="${k}">${j[k]?'✓':STAGE_SHORT[k]}</button>`).join('');
      const du = daysUntil(j.due_date);
      let dueCls='', dueMeta='';
      if(isOverdue(j)){ dueCls='due-overdue'; dueMeta=`<span class="due-meta">${-du}d late</span>`; }
      else if(isDueSoon(j)){ dueCls='due-soon'; dueMeta=`<span class="due-meta">${du===0?'today':du===1?'tomorrow':'in '+du+'d'}</span>`; }
      const stalled = isStalled(j) ? `<span class="stall" title="No stage movement for ${daysSince(j.stage_changed_at)} days">${daysSince(j.stage_changed_at)}d idle</span>` : '';
      const flash = flashQueue.has(j.id) ? ' flash' : '';
      return `<tr data-id="${j.id}" class="${isOpen(j)?'':'is-completed'}${flash}">
        <td class="job-no">${esc(j.job_no)}</td>
        <td class="client">${esc(j.client)}</td>
        <td class="project-name">${esc(j.project)}</td>
        <td class="num">${esc(j.quantity||'–')}</td>
        <td class="due-date ${dueCls}">${fmtDate(j.due_date)}${dueMeta}</td>
        <td>${esc(j.designer||'–')}</td>
        <td><span class="badge pri-${j.priority}">${j.priority}</span></td>
        <td><span class="badge ${statusClass(j.status)}"><i></i>${j.status}</span>${stalled}</td>
        <td><div class="stages">${stages}</div></td>
        <td class="muted" title="${attr(fmtTs(j.updated_at))}${j.updated_by?' by '+attr(j.updated_by):''}">${relTime(j.updated_at)}</td>
        <td class="notes-cell" title="${attr(j.notes||'')}">${esc(j.notes||'–')}</td>
        <td><div class="row-actions"><button class="icon-btn" data-edit="${j.id}" aria-label="Edit job ${esc(j.job_no)}">✎</button><button class="icon-btn danger" data-del="${j.id}" aria-label="Delete job ${esc(j.job_no)}">✕</button></div></td>
      </tr>`;
    }).join('');
    flashQueue.clear();
    holder.innerHTML = `<div class="table-scroll"><table>
      <thead><tr>${th('job_no','Job #')}${th('client','Client')}<th scope="col">Job / project</th><th scope="col" class="num">Qty</th>${th('due_date','Due')}${th('designer','Designer')}${th('priority','Priority')}${th('status','Status')}${th('stage','Stages')}${th('updated_at','Updated')}<th scope="col">Notes</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
    holder.querySelectorAll('[data-sort]').forEach(h=>h.addEventListener('click', ()=>{ const k=h.dataset.sort; if(sort.key===k) sort.dir = sort.dir==='asc'?'desc':'asc'; else { sort={key:k,dir:'asc'}; } render(); }));
    holder.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openModal(b.dataset.edit)));
    holder.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>confirmDelete(b.dataset.del)));
    holder.querySelectorAll('.stage-dot').forEach(d=>d.addEventListener('click', ()=>toggleStage(d.dataset.job, d.dataset.stage)));
  }

  $('#searchInput').addEventListener('input', e=>{ filters.q=e.target.value; const pos=e.target.selectionStart; render(); const s=$('#searchInput'); s.focus(); s.setSelectionRange(pos,pos); });
  $('#filterStatus').addEventListener('change', e=>{ filters.status=e.target.value; render(); });
  $('#filterPriority').addEventListener('change', e=>{ filters.priority=e.target.value; render(); });
  $('#filterDesigner').addEventListener('change', e=>{ filters.designer=e.target.value; render(); });
  $('#filterOverdue').addEventListener('change', e=>{ filters.overdue=e.target.checked; render(); });
  const cf=$('#clearFilters'); if(cf) cf.addEventListener('click', ()=>{ filters={q:'',status:'',priority:'',designer:'',overdue:false}; render(); });
}

async function toggleStage(id, key){
  const j = byId.get(id); if(!j || pendingIds.has(id)) return;
  const patch = {[key]: !j[key]};
  // turning "Ready" on marks the job complete; turning a stage off never changes status
  if(key==='ready' && patch.ready && j.status!=='Completed'){ patch.status='Completed'; }
  await persistUpdate(id, patch, 'Stage change');
}

async function confirmDelete(id){
  const j = byId.get(id); if(!j) return;
  if(!confirm(`Delete job ${j.job_no} (${j.client})? This can't be undone.`)) return;
  if(await persistDelete(id)){ closeModal(); toast('Job deleted.'); }
}

/* ---------- dashboard ---------- */
function renderDashboard(root){
  const open = jobs.filter(isOpen);
  const overdue = open.filter(isOverdue);
  const soon = open.filter(isDueSoon);
  const stalled = open.filter(isStalled);
  const hold = open.filter(j=>j.status==='On Hold');
  const rush = open.filter(j=>j.priority==='Rush');
  const done30 = jobs.filter(j=>j.status==='Completed' && j.date_completed && daysUntil(j.date_completed) >= -30);
  const donePrev30 = jobs.filter(j=>j.status==='Completed' && j.date_completed && daysUntil(j.date_completed) < -30 && daysUntil(j.date_completed) >= -60);
  const doneDelta = done30.length - donePrev30.length;

  // workload by designer (open jobs, with overdue count)
  const byDesigner = {};
  open.forEach(j=>{ const k=j.designer||'Unassigned'; byDesigner[k] = byDesigner[k]||{n:0,over:0}; byDesigner[k].n++; if(isOverdue(j)) byDesigner[k].over++; });
  const designerRows = Object.entries(byDesigner).sort((a,b)=>b[1].n-a[1].n);
  const maxD = Math.max(1, ...designerRows.map(r=>r[1].n));

  // pipeline funnel
  const funnel = new Array(7).fill(0);
  open.forEach(j=>{ funnel[stageIndex(j)]++; });
  const funnelHot = funnel.map((n,i)=>{ const idle = open.filter(j=>stageIndex(j)===i && isStalled(j)).length; return idle; });

  // throughput: completed per week, last 8 weeks (Mon start)
  const weeks = []; const now=new Date(); now.setHours(0,0,0,0);
  const dow = (now.getDay()+6)%7; const thisMon = new Date(now); thisMon.setDate(now.getDate()-dow);
  for(let i=7;i>=0;i--){ const s=new Date(thisMon); s.setDate(thisMon.getDate()-7*i); weeks.push({start:s, n:0, label:s.toLocaleDateString(undefined,{month:'short',day:'numeric'})}); }
  jobs.forEach(j=>{ if(j.status!=='Completed'||!j.date_completed) return; const d=parseDate(j.date_completed); for(let i=weeks.length-1;i>=0;i--){ if(d>=weeks[i].start){ weeks[i].n++; break; } } });
  const maxW = Math.max(1, ...weeks.map(w=>w.n));

  // status mix
  const mix = STATUSES.map(s=>({s, n:jobs.filter(j=>j.status===s).length}));
  const total = jobs.length||1;

  // attention list, most severe first
  const attention = open.map(j=>{
    const reasons=[]; let score=0;
    if(isOverdue(j)){ reasons.push(['overdue', -daysUntil(j.due_date)+'d late']); score+=100 - daysUntil(j.due_date); }
    if(j.priority==='Rush'){ reasons.push(['rush','Rush']); score+=40; }
    if(isStalled(j)){ reasons.push(['stalled', daysSince(j.stage_changed_at)+'d idle']); score+=20+daysSince(j.stage_changed_at); }
    if(isDueSoon(j) && !isOverdue(j)){ const d=daysUntil(j.due_date); reasons.push(['soon', d===0?'due today':'due in '+d+'d']); score+=15-d; }
    if(j.status==='On Hold'){ reasons.push(['hold','On hold']); score+=5; }
    return {j, reasons, score};
  }).filter(x=>x.reasons.length).sort((a,b)=>b.score-a.score).slice(0,12);

  root.innerHTML =
    `<div class="kpis">
      <button class="kpi hero ${overdue.length?'alert':''}" data-goto="overdue"><div class="label">Overdue</div><div class="value">${overdue.length}</div><div class="delta ${overdue.length?'bad':'good'}">${overdue.length?'of '+open.length+' open jobs':'nothing late'}</div></button>
      <button class="kpi" data-goto="open"><div class="label">Open jobs</div><div class="value">${open.length}</div><div class="delta">${rush.length} rush · ${hold.length} on hold</div></button>
      <button class="kpi ${soon.length?'warn':''}" data-goto="soon"><div class="label">Due in ${SOON_DAYS} days</div><div class="value">${soon.length}</div><div class="delta">${soon.filter(j=>daysUntil(j.due_date)===0).length} due today</div></button>
      <button class="kpi ${stalled.length?'warn':''}" data-goto="stalled"><div class="label">Stalled</div><div class="value">${stalled.length}</div><div class="delta">no movement ${STALLED_DAYS}+ days</div></button>
      <button class="kpi" data-goto="completed"><div class="label">Completed, 30 days</div><div class="value">${done30.length}</div><div class="delta ${doneDelta>0?'good':doneDelta<0?'bad':''}">${doneDelta>0?'+':''}${doneDelta} vs prior 30</div></button>
    </div>
    <div class="grid">
      <div class="card span-8">
        <h2>Needs attention</h2>
        <p class="hint">Open jobs that are late, rushed, idle, or due soon. Most urgent first. Click a row to open it.</p>
        ${attention.length ? `<div style="overflow-x:auto"><table class="attn"><thead><tr><th>Job</th><th>Client / project</th><th>Designer</th><th>Stage</th><th>Why</th></tr></thead><tbody>
          ${attention.map(({j,reasons})=>`<tr data-open="${j.id}"><td class="job-no">${esc(j.job_no)}</td><td><b>${esc(j.client)}</b> <span class="muted">${esc(j.project)}</span></td><td>${esc(j.designer||'–')}</td><td>${esc(stageName(j))}</td><td>${reasons.map(([c,t])=>`<span class="reason ${c}">${esc(t)}</span>`).join('')}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="ok">Nothing needs attention right now.</div>'}
      </div>
      <div class="card span-4">
        <h2>Workload by designer</h2>
        <p class="hint">Open jobs per person. Red number is how many are overdue.</p>
        ${designerRows.length ? `<div class="hbars">${designerRows.map(([name,r])=>`<span class="lab" title="${attr(name)}">${esc(name)}</span><div class="track"><div class="bar ${name==='Unassigned'?'soft':''}" style="width:${Math.round(r.n/maxD*100)}%" title="${attr(name)}: ${r.n} open${r.over?', '+r.over+' overdue':''}"></div></div><span class="val">${r.n}${r.over?` <b>${r.over}</b>`:''}</span>`).join('')}</div>` : '<div class="ok">No open jobs.</div>'}
      </div>
      <div class="card span-8">
        <h2>Pipeline</h2>
        <p class="hint">Where open jobs sit right now, by furthest completed stage. Amber means at least one job there is stalled.</p>
        <div class="funnel">${FUNNEL_LABELS.map((l,i)=>`<div class="fstep ${funnelHot[i]?'hot':''}" title="${funnelHot[i]?funnelHot[i]+' stalled':''}"><div class="fn">${funnel[i]}</div><div class="fl">${l}</div></div>`).join('')}</div>
      </div>
      <div class="card span-4">
        <h2>Completed per week</h2>
        <p class="hint">Last 8 weeks, by completion date.</p>
        <div class="cols">${weeks.map((w,i)=>`<div class="col" title="Week of ${attr(w.label)}: ${w.n} completed">${w.n?`<span class="v">${w.n}</span>`:''}<div class="c ${i===weeks.length-1?'cur':''}" style="height:${Math.round(w.n/maxW*100)}%"></div></div>`).join('')}</div>
        <div class="col-labels">${weeks.map(w=>`<span>${esc(w.label)}</span>`).join('')}</div>
      </div>
      <div class="card span-12">
        <h2>Status mix</h2>
        <p class="hint">All ${jobs.length} jobs on the board.</p>
        <div class="stack">${mix.filter(m=>m.n).map(m=>`<div style="width:${m.n/total*100}%;background:${STATUS_COLOR[m.s]}" title="${m.s}: ${m.n}"></div>`).join('')}</div>
        <div class="legend">${mix.map(m=>`<span><i style="background:${STATUS_COLOR[m.s]}"></i>${m.s} <b>${m.n}</b></span>`).join('')}</div>
      </div>
    </div>`;

  root.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click', ()=>openModal(r.dataset.open)));
  root.querySelectorAll('[data-goto]').forEach(k=>k.addEventListener('click', ()=>{
    filters = {q:'',status:'',priority:'',designer:'',overdue:false};
    const g=k.dataset.goto;
    if(g==='overdue') filters.overdue=true;
    if(g==='completed'){ filters.status='Completed'; sort={key:'updated_at',dir:'desc'}; }
    if(g==='soon'||g==='stalled'||g==='open'){ sort={key:'due_date',dir:'asc'}; }
    view='board'; render();
  }));
}

/* ---------- activity ---------- */
async function loadActivity(){
  const { data, error } = await sb.from('job_events').select('*').order('occurred_at',{ascending:false}).limit(200);
  if(!error){ activity = data||[]; activityLoaded = true; }
  return error;
}
function describeEvent(e){
  const who = esc((e.actor||'system').replace(/@.*$/,''));
  const jn = `<code>#${esc(e.job_no)}</code>`;
  if(e.action==='created') return `<span class="who">${who}</span> created ${jn}`;
  if(e.action==='deleted') return `<span class="who">${who}</span> deleted ${jn}`;
  const ch = e.changes||{};
  const parts = Object.keys(ch).map(k=>{
    const {from,to} = ch[k];
    const label = STAGE_FULL[k] || k.replace(/_/g,' ');
    if(STAGE_KEYS.includes(k)) return `${to?'completed':'unchecked'} <code>${esc(label)}</code>`;
    if(k==='notes') return 'edited notes';
    return `<code>${esc(label)}</code> ${esc(pretty(from))} → ${esc(pretty(to))}`;
  });
  return `<span class="who">${who}</span> ${jn}: <span class="chg">${parts.join(', ')}</span>`;
}
function renderActivity(root){
  root.innerHTML = '<div class="card span-12"><h2>Activity</h2><p class="hint">Every change on every job, newest first. Last 200 events.</p><div id="feedHolder"><div class="loading">Loading…</div></div></div>';
  const paint = ()=>{ const h=$('#feedHolder'); if(!h) return; h.innerHTML = activity.length ? `<ul class="feed">${activity.map(e=>`<li><time title="${attr(fmtTs(e.occurred_at))}">${fmtTs(e.occurred_at)}</time><div>${describeEvent(e)}</div></li>`).join('')}</ul>` : '<div class="ok">No activity yet.</div>'; };
  if(activityLoaded) paint(); else loadActivity().then(err=>{ if(err){ const h=$('#feedHolder'); if(h) h.innerHTML='<div class="banner">Could not load activity: '+esc(err.message)+'</div>'; } else paint(); });
}

/* ---------- modal ---------- */
function buildStageChecks(){
  $('#stageChecks').innerHTML = STAGE_KEYS.map(k=>`<label class="stage-check" data-key="${k}"><input type="checkbox" id="in-${k}"> ${STAGE_FULL[k]}</label>`).join('');
  STAGE_KEYS.forEach(k=>$('#in-'+k).addEventListener('change', ()=>updateStageStyle(k)));
}
function updateStageStyle(k){ const cb=$('#in-'+k); cb.closest('.stage-check').classList.toggle('checked', cb.checked); }
function clearErrors(){ document.querySelectorAll('.field').forEach(f=>f.classList.remove('invalid')); }

async function openModal(id){
  clearErrors();
  editingId = id || null;
  const j = id ? byId.get(id) : null;
  if(id && !j) return;
  $('#modalTitle').textContent = j ? `Job ${j.job_no}` : 'New job';
  $('#modalSub').textContent = j ? `Created ${fmtTs(j.created_at)}${j.updated_by?' · last edited by '+j.updated_by:''}` : 'Fields marked with an asterisk are required. The job number is assigned automatically.';
  $('#deleteBtn').hidden = !j;
  $('#in-jobNo').value = j ? j.job_no : '';
  $('#in-client').value = j ? j.client : '';
  $('#in-project').value = j ? j.project : '';
  $('#in-quantity').value = j ? (j.quantity||'') : '';
  $('#in-dueDate').value = j ? (j.due_date||'') : '';
  $('#in-designer').value = j ? (j.designer||'') : '';
  $('#in-priority').value = j ? j.priority : 'Medium';
  $('#in-status').value = j ? j.status : 'In Progress';
  $('#in-dateCompleted').value = j ? (j.date_completed||'') : '';
  $('#in-notes').value = j ? (j.notes||'') : '';
  STAGE_KEYS.forEach(k=>{ $('#in-'+k).checked = j ? !!j[k] : false; updateStageStyle(k); });
  $('#overlay').classList.add('open');
  $('#in-client').focus();
  const hist = $('#history'); hist.hidden = !j;
  if(j){
    $('#historyFeed').innerHTML = '<li><time></time><div class="muted">Loading…</div></li>';
    const { data, error } = await sb.from('job_events').select('*').eq('job_id', j.id).order('occurred_at',{ascending:false}).limit(50);
    if(editingId!==j.id) return;
    $('#historyFeed').innerHTML = error ? `<li><time></time><div class="muted">Could not load history.</div></li>` : (data.length ? data.map(e=>`<li><time>${fmtTs(e.occurred_at)}</time><div>${describeEvent(e)}</div></li>`).join('') : '<li><time></time><div class="muted">No changes recorded yet.</div></li>');
  }
}
function closeModal(){ $('#overlay').classList.remove('open'); editingId=null; }

async function handleSave(){
  clearErrors();
  const client = $('#in-client').value.trim();
  const project = $('#in-project').value.trim();
  let ok=true;
  if(!client){ $('#f-client').classList.add('invalid'); ok=false; }
  if(!project){ $('#f-project').classList.add('invalid'); ok=false; }
  if(!ok) return;
  const row = {
    client, project,
    quantity: $('#in-quantity').value.trim() || null,
    due_date: $('#in-dueDate').value || null,
    designer: $('#in-designer').value.trim() || null,
    priority: $('#in-priority').value,
    status: $('#in-status').value,
    date_completed: $('#in-dateCompleted').value || null,
    notes: $('#in-notes').value.trim() || null,
  };
  STAGE_KEYS.forEach(k=>{ row[k] = $('#in-'+k).checked; });
  const btn=$('#saveBtn'); btn.disabled=true;
  const id = editingId;
  closeModal();
  if(id){ if(await persistUpdate(id, row, 'Save')) toast('Job updated.'); }
  else { const r = await persistInsert(row); if(r) toast(`Job ${r.job_no} added.`); }
  btn.disabled=false;
}

function refreshDatalists(){
  const set = (id, vals)=>{ const dl=document.getElementById(id); if(dl) dl.innerHTML = vals.map(v=>`<option value="${attr(v)}">`).join(''); };
  set('dl-clients', [...new Set(jobs.map(j=>j.client))].sort());
  set('dl-designers', [...new Set(jobs.map(j=>j.designer).filter(Boolean))].sort());
}

/* ---------- CSV export ---------- */
function exportCSV(){
  const cols = ['job_no','client','project','quantity','due_date','designer','priority','status',...STAGE_KEYS,'date_completed','notes','created_at','updated_at','updated_by'];
  const q = v => { if(v==null) return ''; const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [cols.join(','), ...jobs.map(j=>cols.map(c=>q(j[c])).join(','))];
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`jobs-${todayISO()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- global wiring ---------- */
buildStageChecks();
$('#cancelBtn').addEventListener('click', closeModal);
$('#saveBtn').addEventListener('click', handleSave);
$('#deleteBtn').addEventListener('click', ()=>{ if(editingId) confirmDelete(editingId); });
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if(e.key==='Escape' && $('#overlay').classList.contains('open')){ closeModal(); return; }
  if(e.key==='Enter' && (e.metaKey||e.ctrlKey) && $('#overlay').classList.contains('open')){ handleSave(); return; }
  if(typing || !session) return;
  if(e.key==='n'){ e.preventDefault(); openModal(null); }
  if(e.key==='/'){ e.preventDefault(); if(view!=='board'){ view='board'; render(); } const s=$('#searchInput'); if(s) s.focus(); }
});

// re-evaluate "overdue" and "idle" once a minute so a tab left open stays honest
setInterval(()=>{ if(session && loaded && !$('#overlay').classList.contains('open') && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) render(); }, 60000);

// test hook (harmless in production)
window.__jobboard = { get jobs(){ return jobs; }, render, setView:(v)=>{ view=v; render(); } };

boot();
})();
</script>
